[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "transacao-financeira"
version = "1.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
